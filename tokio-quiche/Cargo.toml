[package]
name = "tokio-quiche"
version = "0.23.0"
description = "Asynchronous wrapper around quiche"
repository = "https://github.com/cloudflare/quiche"
edition = "2021"
license = "BSD-2-Clause"
keywords = ["quic", "http3", "tokio"]
categories = ["network-programming"]
readme = "README.md"
rust-version = "1.88"
build = "build.rs"

[features]
default = ["qlog-gzip", "qlog-zstd"]

# Forwarded quiche features for re-exports
congestion_window_unchecked_available = ["quiche/congestion_window_unchecked_available"]
fuzzing = ["quiche/fuzzing"]
quiche_internal = ["quiche/internal"]

# Enable extra timing instrumentation for QUIC handshakes, including protocol
# overhead and network delays.
perf-quic-listener-metrics = []

# Enable raw public key (RPK) support for QUIC handshakes.
rpk = ["boring/rpk"]

# Replaces quiche's original congestion control
# implementation with one adapted from google/quiche.
gcongestion = ["quiche/gcongestion"]
# Deprecated: zero-copy sends are now always enabled when using tokio-quiche.
# This feature is kept for backwards compatibility and only enables `gcongestion`.
zero-copy = ["gcongestion"]
# Allow client connections to provide a custom DCID when initiating a
# connection. Be aware that RFC 9000 places requirements for unpredictability and
# length on the client DCID field. Enabling this feature can be dangerous if these
# requirements are not satisfied.
custom-client-dcid = ["quiche/custom-client-dcid"]

# Deprecated: use `--cfg capture_keylogs` instead.
capture_keylogs = []

# Enable scheduling & poll duration histograms for tokio tasks.
tokio-task-metrics = []

# Enable gzip compression for QLOG output files. Forwards to the
# `qlog` crate's `gzip` feature so `QuicSettings::qlog_compression =
# QlogCompression::Gzip` is available at runtime and emits
# `.sqlog.gz` files. Pulls in `flate2` with its crate-default backend
# (consumers can override the backend by depending on `flate2`
# directly).
#
# May be combined with `qlog-zstd`; the algorithm is selected per
# connection at runtime via `QuicSettings::qlog_compression`.
qlog-gzip = ["qlog/gzip"]

# Enable zstd compression for QLOG output files. Forwards to the
# `qlog` crate's `zstd` feature so `QuicSettings::qlog_compression =
# QlogCompression::Zstd` is available at runtime and emits
# `.sqlog.zst` files. Pulls in the `zstd` crate, which links against
# `zstd-sys` (a C dependency).
#
# May be combined with `qlog-gzip`; the algorithm is selected per
# connection at runtime via `QuicSettings::qlog_compression`.
qlog-zstd = ["qlog/zstd"]

[package.metadata.cargo-machete]
# boring-sys is a dependency solely for its `DEP_BORINGSSL_VERSION_MAJOR`
# env var, which build.rs reads to detect boring 5.x. It is never
# imported in source code.
ignored = ["boring-sys"]

[lints.clippy]
mem_forget = "deny"
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(capture_keylogs)", "cfg(test_invalid_len_compilation_fail)", "cfg(boring_v5)"] }

[dependencies]
anyhow = { version = "1" }
boring = { version = ">=4.19, <6" }
boring-sys = { version = ">=4.19, <6" }
bytes = { version = "1.11.1" }
crossbeam = { version = "0.8.1", default-features = false }
debug_panic = { version = "0.2.1" }
datagram-socket = { version = "0.8.1" }
foundations = { version = ">=4,<6", default-features = false, features = [
  "server-client-common-default",
] }
futures = { version = "0.3" }
futures-util = { version = "0.3", default-features = false }
hashlink = { version = "0.12.1" }
ipnetwork = { version = "0.21" }
log = { version = "0.4.20" }
octets = { version = "0.3.7" }
pin-project = { version = "1.0.12" }
qlog = { version = "0.18.2", features = ["foundations"] }
quiche = { version = "0.30.1", features = ["boringssl-boring-crate", "qlog"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_with = { version = "3", default-features = false }
slog-scope = { version = "4.0" }
slog-stdlog = { version = "4.1.1" }
smallvec = { version = "1.10", default-features = false }
task-killswitch = { version = "0.2.1" }
thiserror = { version = "2" }
tokio = { version = "1.44", default-features = false, features = ["macros", "rt"] }
tokio-stream = { version = "0.1", features = ["net", "io-util"] }
tokio-util = { version = "0.7.13", features = [
  "compat",
  "time",
  "codec",
  "io",
  "rt",
] }
url = { version = "2" }

[dev-dependencies]
assert_matches = { version = "1" }
clap = { version = "4", features = ["derive"] }
env_logger = { version = "0.11" }
h3i = { version = "0.7", default-features = false }
http = "1"
http-body = "1"
http-body-util = "0.1"
regex = { version = "1.4.2" }
rstest = { version = "0.26.1" }
serde_json = { version = "1" }
tempfile = "3"
tokio = { version = "1.44", default-features = false, features = ["time", "test-util", "rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = ">=0.2.76, <0.2.190", default-features = false }
nix = { version = "0.31.3", features = ["net", "uio", "socket", "signal"] }
